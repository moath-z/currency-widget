name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Check rate sources
        continue-on-error: true
        run: |
          for u in https://open.er-api.com/v6/latest/EUR https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/eur.json https://latest.currency-api.pages.dev/v1/currencies/eur.json; do
            body=$(curl -s -m 15 -A "Mozilla/5.0 (Android) CurrencyWidget/1.1" "$u" | head -c 4000)
            sar=$(echo "$body" | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('rates') or d.get('eur');print(r.get('SAR') or r.get('sar'), r.get('GBP') or r.get('gbp'))" 2>&1 | tail -1)
            echo "::notice title=$u::$sar"
          done

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CurrencyWidget.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Currency Widget (build ${{ github.run_number }})
          body: Download CurrencyWidget.apk below and open it on your phone to install.
          files: CurrencyWidget.apk
          make_latest: true
